<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Escravo, Nem Pensar!</title>
  <style>
    :root {
      --terracota-escuro: #8B3A2B;
      --terracota: #C05621;
      --fundo: #F7FAFC;
      --card-bg: #FFFFFF;
      --texto: #2D3748;
      --texto-suave: #718096;
      --borda: #E2E8F0;
      --sidebar-width: 250px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--fundo); color: var(--texto); display: flex; min-height: 100vh; }

    /* Layout Principal */
    .app-container { display: flex; width: 100%; min-height: 100vh; position: relative; }
    
    /* Sidebar Responsiva */
    sidebar {
      width: var(--sidebar-width);
      background: var(--terracota-escuro);
      color: white;
      padding: 20px 10px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .app-container.sidebar-collapsed sidebar {
      width: 60px;
    }

    .app-container.sidebar-collapsed .sidebar-text {
      display: none;
    }

    sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; padding: 0 10px; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 12px; border: none;
      background: none; color: white; text-align: left;
      cursor: pointer; border-radius: 6px; font-size: 1rem;
      margin-bottom: 5px;
    }
    .nav-btn:hover, .nav-btn.active { background-color: var(--terracota); }

    /* Área de Conteúdo */
    main { flex: 1; padding: 20px; overflow-x: hidden; }
    .page-section { display: none; }
    .page-section.active { display: block; }

    /* Painel e Formatação */
    .admin-box { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--borda); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-weight: 600; font-size: 0.9rem; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%; padding: 10px; border: 1px solid var(--borda); border-radius: 6px; font-size: 1rem;
    }
    .editor-content { min-height: 120px; border: 1px solid var(--borda); padding: 10px; border-radius: 6px; background: white; margin-top: 5px; }
    
    /* Botões */
    .btn-action {
      background: var(--terracota); color: white; border: none;
      padding: 10px 18px; border-radius: 6px; cursor: pointer;
      font-weight: 600; transition: background 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-secondary { background: var(--texto-suave); }
    .btn-danger { background: #E53E3E; }
    .editor-toolbar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
    .editor-toolbar button { padding: 5px 10px; cursor: pointer; border: 1px solid var(--borda); background: white; border-radius: 4px; }

    /* Cards e Grids */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
    .card { background: white; border-radius: 8px; border: 1px solid var(--borda); overflow: hidden; display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 180px; object-fit: cover; }
    .card-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; flex: 1; }

    /* Tabela */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid var(--borda); }
    th { background: #EDF2F7; }

    /* Toast */
    .toast-msg {
      position: fixed; bottom: 20px; right: 20px; background: #2B6CB0; color: white;
      padding: 12px 24px; border-radius: 6px; display: none; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .toast-msg.show { display: block; }

    /* RESPONSIVIDADE (MOBILE) */
    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      sidebar { width: 100% !important; height: auto; padding: 10px; }
      .app-container.sidebar-collapsed sidebar { width: 100% !important; }
      .app-container.sidebar-collapsed .sidebar-text { display: inline; }
      .nav-btn { justify-content: flex-start; }
      main { padding: 10px; }
      .cards-grid { grid-template-columns: 1fr; }
      th, td { padding: 8px; font-size: 0.85rem; }
      .btn-action { width: 100%; margin-bottom: 5px; }
    }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">
    <!-- SIDEBAR -->
    <sidebar id="appSidebar">
      <button class="btn-action btn-secondary" id="toggleSidebarBtn" style="margin-bottom: 15px;">☰ <span class="sidebar-text">Menu</span></button>
      <h2 class="sidebar-text" id="sidebarSchoolLabel">CETI José Marques</h2>
      
      <button class="nav-btn active" data-page="home">🏠 <span class="sidebar-text">Início</span></button>
      <button class="nav-btn" data-page="about">ℹ️ <span class="sidebar-text">Sobre</span></button>
      <button class="nav-btn" data-page="activities">📚 <span class="sidebar-text">Atividades</span></button>
      <button class="nav-btn" data-page="materials">📁 <span class="sidebar-text">Materiais</span></button>
      <button class="nav-btn" data-page="admin">⚙️ <span class="sidebar-text">Administração</span></button>
    </sidebar>

    <!-- ÁREA PRINCIPAL -->
    <main>
      <!-- HEADER / HERO -->
      <header style="margin-bottom: 20px;">
        <h1 id="heroTitleDisplay">Projeto Escravo, Nem Pensar!</h1>
        <p style="color: var(--texto-suave);" id="heroSchoolDisplay">CETI José Marques</p>
      </header>

      <!-- PÁGINA INICIAL -->
      <section id="homePage" class="page-section active">
        <div class="admin-box">
          <input type="text" id="homeSearchInput" placeholder="🔍 Pesquisar atividades...">
          <h3 style="margin-top: 15px;">Destaques</h3>
          <div class="cards-grid" id="recentActivitiesGrid"></div>
        </div>
      </section>

      <!-- PÁGINA SOBRE -->
      <section id="aboutPage" class="page-section">
        <div class="admin-box" id="aboutContentDisplay"></div>
      </section>

      <!-- PÁGINA ATIVIDADES -->
      <section id="activitiesPage" class="page-section">
        <div class="admin-box">
          <input type="text" id="actSearchInput" placeholder="🔍 Pesquisar em atividades...">
          <div class="cards-grid" id="activitiesGrid"></div>
        </div>
      </section>

      <!-- PÁGINA MATERIAIS -->
      <section id="materialsPage" class="page-section">
        <div class="admin-box">
          <div class="cards-grid" id="materialsGrid"></div>
        </div>
      </section>

      <!-- PÁGINA DETALHES DO ITEM -->
      <section id="contentViewPage" class="page-section">
        <button class="btn-action btn-secondary" id="backBtn" style="margin-bottom: 15px;">← Voltar</button>
        <div class="admin-box">
          <h2 id="viewTitle"></h2>
          <div id="viewCover"></div>
          <div id="viewBody"></div>
        </div>
      </section>

      <!-- PÁGINA ADMIN -->
      <section id="adminPage" class="page-section">
        <!-- LOGIN ADMIN -->
        <div class="admin-box" id="adminLoginBox" style="max-width: 400px; margin: 40px auto;">
          <h3>🔒 Acesso Restrito</h3>
          <form id="adminLoginForm">
            <div class="form-group">
              <label>Senha de Acesso:</label>
              <input type="password" id="adminPassword" required placeholder="Digite a senha...">
            </div>
            <button type="submit" class="btn-action" style="width: 100%;">Entrar</button>
          </form>
        </div>

        <!-- PAINEL ADMIN (OCULTO INICIALMENTE) -->
        <div id="adminPanel" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Painel de Controle</h2>
            <button class="btn-action btn-danger" id="logoutAdminBtn">Sair do Painel</button>
          </div>

          <!-- CONFIGURAÇÕES -->
          <div class="admin-box">
            <h3>⚙️ Configurações Gerais</h3>
            <div class="form-group">
              <label>Título do Projeto:</label>
              <input type="text" id="inputHeaderTitle">
            </div>
            <div class="form-group">
              <label>Nome da Escola:</label>
              <input type="text" id="inputSchoolName">
            </div>
            <button class="btn-action" id="btnSaveConfig">Salvar Configurações Gerais</button>
          </div>

          <!-- EDITOR DA PÁGINA SOBRE -->
          <div class="admin-box">
            <h3>📝 Editar Conteúdo "Sobre o Projeto"</h3>
            <div class="form-group">
              <div class="editor-toolbar">
                <button type="button" onclick="execCmd('bold')"><b>B</b></button>
                <button type="button" onclick="execCmd('italic')"><i>I</i></button>
                <button type="button" onclick="execCmd('underline')"><u>U</u></button>
                <button type="button" onclick="execCmd('justifyLeft')">Esquerda</button>
                <button type="button" onclick="execCmd('justifyCenter')">Centralizar</button>
                <button type="button" onclick="execCmd('justifyRight')">Direita</button>
                <button type="button" onclick="execCmd('insertUnorderedList')">• Lista</button>
                <label class="btn-action btn-secondary" style="padding: 2px 8px; cursor: pointer; display: inline-block;">
                  🖼️ Inserir Imagem <input type="file" accept="image/*" style="display:none;" onchange="insertLocalImageEditor(event, 'aboutEditor')">
                </label>
              </div>
              <div id="aboutEditor" class="editor-content" contenteditable="true"></div>
            </div>
            <button class="btn-action" id="btnSaveAbout">Salvar Página Sobre</button>
          </div>

          <!-- FORMULÁRIO DE CADASTRO -->
          <div class="admin-box">
            <h3 id="formContentTitle">➕ Cadastrar Nova Atividade / Material</h3>
            <form id="contentForm">
              <input type="hidden" id="contentId">
              <div class="form-group">
                <label>Tipo de Item:</label>
                <select id="contentType" required>
                  <option value="activity">Atividade Pedagógica</option>
                  <option value="material">Material de Apoio</option>
                </select>
              </div>

              <div class="form-group">
                <label>Título:</label>
                <input type="text" id="contentTitle" required placeholder="Ex: Oficina de Leitura">
              </div>

              <div class="form-group">
                <label>Status (Apenas para Atividades):</label>
                <select id="contentStatus">
                  <option value="concluido">Concluído</option>
                  <option value="andamento">Em Andamento</option>
                  <option value="planejado">Planejado</option>
                </select>
              </div>

              <div class="form-group">
                <label>Imagem de Capa (Galeria):</label>
                <input type="file" id="contentCoverFile" accept="image/*">
                <input type="hidden" id="contentCoverBase64">
                <div id="coverPreview" style="margin-top: 10px;"></div>
              </div>

              <div class="form-group">
                <label>Resumo / Descrição Curta:</label>
                <textarea id="contentSummary" rows="3" required placeholder="Resumo do item..."></textarea>
              </div>

              <div class="form-group">
                <label>Conteúdo Detalhado:</label>
                <div class="editor-toolbar">
                  <button type="button" onclick="execCmd('bold')"><b>B</b></button>
                  <button type="button" onclick="execCmd('italic')"><i>I</i></button>
                  <button type="button" onclick="execCmd('underline')"><u>U</u></button>
                  <button type="button" onclick="execCmd('justifyLeft')">Esquerda</button>
                  <button type="button" onclick="execCmd('justifyCenter')">Centralizar</button>
                  <button type="button" onclick="execCmd('insertUnorderedList')">• Lista</button>
                  <label class="btn-action btn-secondary" style="padding: 2px 8px; cursor: pointer; display: inline-block;">
                    🖼️ Inserir Imagem <input type="file" accept="image/*" style="display:none;" onchange="insertLocalImageEditor(event, 'contentBodyEditor')">
                  </label>
                </div>
                <div id="contentBodyEditor" class="editor-content" contenteditable="true"></div>
              </div>

              <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn-action" id="btnSaveContent">Salvar Item</button>
                <button type="button" class="btn-action btn-secondary" id="btnCancelEdit" style="display: none;">Cancelar Edição</button>
              </div>
            </form>
          </div>

          <!-- TABELA ADMIN -->
          <div class="admin-box">
            <h3>📋 Itens Cadastrados</h3>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Tipo</th>
                    <th>Título</th>
                    <th>Status</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="adminContentTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast-msg">Operação realizada com sucesso!</div>

  <script>
    /* 1. DADOS INICIAIS DA APLICAÇÃO */
    const defaultData = {
      config: {
        title: "Projeto Escravo, Nem Pensar!",
        school: "CETI José Marques"
      },
      about: `<h3>Sobre a Iniciativa</h3><p>O programa <strong>Escravo, Nem Pensar!</strong> é uma iniciativa pioneira de prevenção ao trabalho escravo.</p>`,
      items: [
        {
          id: "1",
          type: "activity",
          title: "Cine-Debate: Trabalho Escravo Contemporâneo",
          status: "concluido",
          cover: "",
          summary: "Exibição de documentário com mesa redonda.",
          body: "<p>Realizamos no auditório da escola a exibição de um documentário reflexivo.</p>"
        }
      ]
    };

    function getAppData() {
      const data = localStorage.getItem('enp_app_data');
      return data ? JSON.parse(data) : defaultData;
    }

    function saveAppData(data) {
      localStorage.setItem('enp_app_data', JSON.stringify(data));
      renderApp();
    }

    let previousPage = 'home';

    /* 2. MENU RETRÁTIL E NAVEGAÇÃO */
    const appContainer = document.getElementById('appContainer');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const navButtons = document.querySelectorAll('.nav-btn');
    const sections = document.querySelectorAll('.page-section');
    const backBtn = document.getElementById('backBtn');

    // Botão de recolher/expandir menu corrigido
    toggleSidebarBtn.addEventListener('click', () => {
      appContainer.classList.toggle('sidebar-collapsed');
    });

    function navigateTo(pageId) {
      sections.forEach(sec => sec.classList.remove('active'));
      const targetSection = document.getElementById(pageId + 'Page') || document.getElementById(pageId);
      if (targetSection) {
        targetSection.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      navButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === pageId);
      });
    }

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const page = btn.dataset.page;
        previousPage = page;
        navigateTo(page);
      });
    });

    backBtn.addEventListener('click', () => navigateTo(previousPage));

    /* 3. UPLOAD DE IMAGEM LOCAL (SEM URL) */
    document.getElementById('contentCoverFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('contentCoverBase64').value = evt.target.result;
          document.getElementById('coverPreview').innerHTML = `<img src="${evt.target.result}" style="max-height:100px; border-radius:4px;">`;
        };
        reader.readAsDataURL(file);
      }
    });

    function insertLocalImageEditor(event, editorId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgHtml = `<img src="${e.target.result}" style="max-width:100%; height:auto; border-radius:4px; margin: 10px 0;">`;
          document.getElementById(editorId).focus();
          document.execCommand('insertHTML', false, imgHtml);
        };
        reader.readAsDataURL(file);
      }
    }

    /* 4. RENDERIZAÇÃO DE CONTEÚDO */
    function renderApp() {
      const data = getAppData();

      document.getElementById('heroTitleDisplay').textContent = data.config.title;
      document.getElementById('heroSchoolDisplay').textContent = data.config.school;
      document.getElementById('sidebarSchoolLabel').textContent = data.config.school;
      document.getElementById('aboutContentDisplay').innerHTML = data.about;

      document.getElementById('inputHeaderTitle').value = data.config.title;
      document.getElementById('inputSchoolName').value = data.config.school;
      document.getElementById('aboutEditor').innerHTML = data.about;

      const activities = data.items.filter(i => i.type === 'activity');
      const materials = data.items.filter(i => i.type === 'material');

      renderGrid('recentActivitiesGrid', activities.slice(0, 3));
      renderGrid('activitiesGrid', activities);
      renderGrid('materialsGrid', materials);
      renderAdminTable(data.items);
    }

    function renderGrid(containerId, items) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p style="color: var(--texto-suave);">Nenhum item cadastrado.</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${item.cover ? `<img src="${item.cover}" class="card-img" alt="${item.title}">` : ''}
          <div class="card-body">
            <h3>${item.title}</h3>
            <p>${item.summary}</p>
            <button class="btn-action" onclick="viewDetail('${item.id}')">Ver Detalhes</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function viewDetail(id) {
      const data = getAppData();
      const item = data.items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('viewTitle').textContent = item.title;
      document.getElementById('viewCover').innerHTML = item.cover ? `<img src="${item.cover}" style="width:100%; max-height:400px; object-fit:cover; border-radius:8px; margin-bottom:20px;">` : '';
      document.getElementById('viewBody').innerHTML = item.body || item.summary;

      navigateTo('contentViewPage');
    }

    /* 5. BUSCA EM TEMPO REAL */
    document.getElementById('homeSearchInput').addEventListener('input', (e) => filterList(e.target.value, 'activity', 'recentActivitiesGrid'));
    document.getElementById('actSearchInput').addEventListener('input', (e) => filterList(e.target.value, 'activity', 'activitiesGrid'));

    function filterList(query, type, containerId) {
      const data = getAppData();
      const filtered = data.items.filter(i => i.type === type && (i.title.toLowerCase().includes(query.toLowerCase()) || i.summary.toLowerCase().includes(query.toLowerCase())));
      renderGrid(containerId, filtered);
    }

    /* 6. ADMIN E AUTENTICAÇÃO COM SENHA 'admin123' */
    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminLoginBox = document.getElementById('adminLoginBox');
    const adminPanel = document.getElementById('adminPanel');
    const logoutAdminBtn = document.getElementById('logoutAdminBtn');

    adminLoginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('adminPassword').value;
      if (pass === 'admin123') { 
        adminLoginBox.style.display = 'none';
        adminPanel.style.display = 'block';
        showToast('Acesso concedido!');
      } else {
        alert('Senha incorreta! Tente novamente.');
      }
    });

    logoutAdminBtn.addEventListener('click', () => {
      adminLoginBox.style.display = 'block';
      adminPanel.style.display = 'none';
      document.getElementById('adminPassword').value = '';
    });

    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
    }

    document.getElementById('btnSaveConfig').addEventListener('click', () => {
      const data = getAppData();
      data.config.title = document.getElementById('inputHeaderTitle').value;
      data.config.school = document.getElementById('inputSchoolName').value;
      saveAppData(data);
      showToast('Configurações salvas!');
    });

    document.getElementById('btnSaveAbout').addEventListener('click', () => {
      const data = getAppData();
      data.about = document.getElementById('aboutEditor').innerHTML;
      saveAppData(data);
      showToast('Conteúdo "Sobre" atualizado!');
    });

    /* 7. CRUD DE ITENS */
    const contentForm = document.getElementById('contentForm');
    const btnCancelEdit = document.getElementById('btnCancelEdit');

    contentForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = getAppData();
      const id = document.getElementById('contentId').value;

      const newItem = {
        id: id ? id : Date.now().toString(),
        type: document.getElementById('contentType').value,
        title: document.getElementById('contentTitle').value,
        status: document.getElementById('contentStatus').value,
        cover: document.getElementById('contentCoverBase64').value,
        summary: document.getElementById('contentSummary').value,
        body: document.getElementById('contentBodyEditor').innerHTML
      };

      if (id) {
        const index = data.items.findIndex(i => i.id === id);
        if (index !== -1) data.items[index] = newItem;
      } else {
        data.items.push(newItem);
      }

      saveAppData(data);
      resetForm();
      showToast(id ? 'Item atualizado!' : 'Item cadastrado com sucesso!');
    });

    function renderAdminTable(items) {
      const tbody = document.getElementById('adminContentTable');
      tbody.innerHTML = '';

      items.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.type === 'activity' ? 'Atividade' : 'Material'}</strong></td>
          <td>${item.title}</td>
          <td>${item.type === 'activity' ? item.status : '-'}</td>
          <td>
            <button class="btn-action btn-secondary" style="padding: 4px 8px; font-size: 0.8rem;" onclick="editItem('${item.id}')">Editar</button>
            <button class="btn-action btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="deleteItem('${item.id}')">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function editItem(id) {
      const data = getAppData();
      const item = data.items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('contentId').value = item.id;
      document.getElementById('contentType').value = item.type;
      document.getElementById('contentTitle').value = item.title;
      document.getElementById('contentStatus').value = item.status;
      document.getElementById('contentCoverBase64').value = item.cover || '';
      document.getElementById('coverPreview').innerHTML = item.cover ? `<img src="${item.cover}" style="max-height:100px;">` : '';
      document.getElementById('contentSummary').value = item.summary;
      document.getElementById('contentBodyEditor').innerHTML = item.body || '';

      document.getElementById('formContentTitle').textContent = "✏️ Editar Item";
      btnCancelEdit.style.display = 'inline-block';
      window.scrollTo({ top: contentForm.offsetTop - 50, behavior: 'smooth' });
    }

    function deleteItem(id) {
      if (confirm('Tem certeza que deseja excluir este item?')) {
        const data = getAppData();
        data.items = data.items.filter(i => i.id !== id);
        saveAppData(data);
        showToast('Item excluído com sucesso!');
      }
    }

    function resetForm() {
      document.getElementById('contentId').value = '';
      contentForm.reset();
      document.getElementById('contentCoverBase64').value = '';
      document.getElementById('coverPreview').innerHTML = '';
      document.getElementById('contentBodyEditor').innerHTML = '';
      document.getElementById('formContentTitle').textContent = "➕ Cadastrar Nova Atividade / Material";
      btnCancelEdit.style.display = 'none';
    }

    btnCancelEdit.addEventListener('click', resetForm);

    /* 8. TOAST NOTIFICAÇÃO */
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    /* INICIALIZAÇÃO DA APLICAÇÃO */
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
