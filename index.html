<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Escravo, Nem Pensar!</title>
  <style>
    :root {
      --terracota-escuro: #8B3A2B;
      --terracota: #C05621;
      --fundo: #F7FAFC;
      --card-bg: #FFFFFF;
      --texto: #2D3748;
      --texto-suave: #718096;
      --borda: #E2E8F0;
      --sidebar-width: 250px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--fundo); color: var(--texto); display: flex; min-height: 100vh; }

    /* Layout Principal */
    .app-container { display: flex; width: 100%; min-height: 100vh; position: relative; }
    
    /* Sidebar Responsiva */
    sidebar {
      width: var(--sidebar-width);
      background: var(--terracota-escuro);
      color: white;
      padding: 20px 10px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .app-container.sidebar-collapsed sidebar {
      width: 60px;
    }

    .app-container.sidebar-collapsed .sidebar-text {
      display: none;
    }

    sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; padding: 0 10px; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 12px; border: none;
      background: none; color: white; text-align: left;
      cursor: pointer; border-radius: 6px; font-size: 1rem;
      margin-bottom: 5px;
    }
    .nav-btn:hover, .nav-btn.active { background-color: var(--terracota); }

    /* Área de Conteúdo */
    main { flex: 1; padding: 20px; overflow-x: hidden; }
    .page-section { display: none; }
    .page-section.active { display: block; }

    /* Painel e Formatação */
    .admin-box { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--borda); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-weight: 600; font-size: 0.9rem; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%; padding: 10px; border: 1px solid var(--borda); border-radius: 6px; font-size: 1rem;
    }
    .editor-content { min-height: 120px; border: 1px solid var(--borda); padding: 10px; border-radius: 6px; background: white; margin-top: 5px; }
    
    /* Botões */
    .btn-action {
      background: var(--terracota); color: white; border: none;
      padding: 10px 18px; border-radius: 6px; cursor: pointer;
      font-weight: 600; transition: background 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-action:disabled { background: var(--texto-suave); cursor: not-allowed; }
    .btn-secondary { background: var(--texto-suave); }
    .btn-danger { background: #E53E3E; }
    .editor-toolbar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
    .editor-toolbar button { padding: 5px 10px; cursor: pointer; border: 1px solid var(--borda); background: white; border-radius: 4px; }

    /* Cards e Grids */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
    .card { background: white; border-radius: 8px; border: 1px solid var(--borda); overflow: hidden; display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 180px; object-fit: cover; }
    .card-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; flex: 1; }

    /* Tabela */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid var(--borda); }
    th { background: #EDF2F7; }

    /* Toast */
    .toast-msg {
      position: fixed; bottom: 20px; right: 20px; background: #2B6CB0; color: white;
      padding: 12px 24px; border-radius: 6px; display: none; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .toast-msg.show { display: block; }

    /* RESPONSIVIDADE (MOBILE) */
    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      sidebar { width: 100% !important; height: auto; padding: 10px; }
      .app-container.sidebar-collapsed sidebar { width: 100% !important; }
      .app-container.sidebar-collapsed .sidebar-text { display: inline; }
      .nav-btn { justify-content: flex-start; }
      main { padding: 10px; }
      .cards-grid { grid-template-columns: 1fr; }
      th, td { padding: 8px; font-size: 0.85rem; }
      .btn-action { width: 100%; margin-bottom: 5px; }
    }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">
    <!-- SIDEBAR -->
    <sidebar id="appSidebar">
      <button class="btn-action btn-secondary" id="toggleSidebarBtn" style="margin-bottom: 15px;">☰ <span class="sidebar-text">Menu</span></button>
      <h2 class="sidebar-text" id="sidebarSchoolLabel">Carregando...</h2>
      
      <button class="nav-btn active" data-page="home">🏠 <span class="sidebar-text">Início</span></button>
      <button class="nav-btn" data-page="about">ℹ️ <span class="sidebar-text">Sobre</span></button>
      <button class="nav-btn" data-page="activities">📚 <span class="sidebar-text">Atividades</span></button>
      <button class="nav-btn" data-page="materials">📁 <span class="sidebar-text">Materiais</span></button>
      <button class="nav-btn" data-page="admin">⚙️ <span class="sidebar-text">Administração</span></button>
    </sidebar>

    <!-- ÁREA PRINCIPAL -->
    <main>
      <!-- HEADER / HERO -->
      <header style="margin-bottom: 20px;">
        <h1 id="heroTitleDisplay">Carregando...</h1>
        <p style="color: var(--texto-suave);" id="heroSchoolDisplay">Aguarde um momento</p>
      </header>

      <!-- PÁGINA INICIAL -->
      <section id="homePage" class="page-section active">
        <div class="admin-box">
          <input type="text" id="homeSearchInput" placeholder="🔍 Pesquisar atividades...">
          <h3 style="margin-top: 15px;">Destaques</h3>
          <div class="cards-grid" id="recentActivitiesGrid"></div>
        </div>
      </section>

      <!-- PÁGINA SOBRE -->
      <section id="aboutPage" class="page-section">
        <div class="admin-box" id="aboutContentDisplay"></div>
      </section>

      <!-- PÁGINA ATIVIDADES -->
      <section id="activitiesPage" class="page-section">
        <div class="admin-box">
          <input type="text" id="actSearchInput" placeholder="🔍 Pesquisar em atividades...">
          <div class="cards-grid" id="activitiesGrid"></div>
        </div>
      </section>

      <!-- PÁGINA MATERIAIS -->
      <section id="materialsPage" class="page-section">
        <div class="admin-box">
          <div class="cards-grid" id="materialsGrid"></div>
        </div>
      </section>

      <!-- PÁGINA DETALHES DO ITEM -->
      <section id="contentViewPage" class="page-section">
        <button class="btn-action btn-secondary" id="backBtn" style="margin-bottom: 15px;">← Voltar</button>
        <div class="admin-box">
          <h2 id="viewTitle"></h2>
          <div id="viewCover"></div>
          <div id="viewBody"></div>
        </div>
      </section>

      <!-- PÁGINA ADMIN -->
      <section id="adminPage" class="page-section">
        <!-- LOGIN ADMIN -->
        <div class="admin-box" id="adminLoginBox" style="max-width: 400px; margin: 40px auto;">
          <h3>🔒 Acesso Restrito</h3>
          <form id="adminLoginForm">
            <div class="form-group">
              <label>Senha de Acesso:</label>
              <input type="password" id="adminPassword" required placeholder="Digite a senha...">
            </div>
            <button type="submit" class="btn-action" style="width: 100%;">Entrar</button>
          </form>
        </div>

        <!-- PAINEL ADMIN -->
        <div id="adminPanel" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Painel de Controle</h2>
            <button class="btn-action btn-danger" id="logoutAdminBtn">Sair do Painel</button>
          </div>

          <!-- CONFIGURAÇÕES -->
          <div class="admin-box">
            <h3>⚙️ Configurações Gerais</h3>
            <div class="form-group">
              <label>Título do Projeto:</label>
              <input type="text" id="inputHeaderTitle">
            </div>
            <div class="form-group">
              <label>Nome da Escola:</label>
              <input type="text" id="inputSchoolName">
            </div>
            <button class="btn-action" id="btnSaveConfig">Salvar Configurações Gerais</button>
          </div>

          <!-- EDITOR DA PÁGINA SOBRE -->
          <div class="admin-box">
            <h3>📝 Editar Conteúdo "Sobre o Projeto"</h3>
            <div class="form-group">
              <div class="editor-toolbar">
                <button type="button" data-cmd="bold"><b>B</b></button>
                <button type="button" data-cmd="italic"><i>I</i></button>
                <button type="button" data-cmd="underline"><u>U</u></button>
                <button type="button" data-cmd="justifyLeft">Esquerda</button>
                <button type="button" data-cmd="justifyCenter">Centralizar</button>
                <button type="button" data-cmd="justifyRight">Direita</button>
                <button type="button" data-cmd="insertUnorderedList">• Lista</button>
              </div>
              <div id="aboutEditor" class="editor-content" contenteditable="true"></div>
            </div>
            <button class="btn-action" id="btnSaveAbout">Salvar Página Sobre</button>
          </div>

          <!-- FORMULÁRIO DE CADASTRO -->
          <div class="admin-box">
            <h3 id="formContentTitle">➕ Cadastrar Nova Atividade / Material</h3>
            <form id="contentForm">
              <input type="hidden" id="contentId">
              <div class="form-group">
                <label>Tipo de Item:</label>
                <select id="contentType" required>
                  <option value="activity">Atividade Pedagógica</option>
                  <option value="material">Material de Apoio</option>
                </select>
              </div>

              <div class="form-group">
                <label>Título:</label>
                <input type="text" id="contentTitle" required placeholder="Ex: Oficina de Leitura">
              </div>

              <div class="form-group">
                <label>Status (Apenas para Atividades):</label>
                <select id="contentStatus">
                  <option value="concluido">Concluído</option>
                  <option value="andamento">Em Andamento</option>
                  <option value="planejado">Planejado</option>
                </select>
              </div>

              <div class="form-group">
                <label>Imagem de Capa (Galeria):</label>
                <input type="file" id="contentCoverFile" accept="image/*">
                <div id="coverPreview" style="margin-top: 10px;"></div>
              </div>

              <div class="form-group">
                <label>Resumo / Descrição Curta:</label>
                <textarea id="contentSummary" rows="3" required placeholder="Resumo do item..."></textarea>
              </div>

              <div class="form-group">
                <label>Conteúdo Detalhado:</label>
                <div class="editor-toolbar">
                  <button type="button" data-cmd="bold"><b>B</b></button>
                  <button type="button" data-cmd="italic"><i>I</i></button>
                  <button type="button" data-cmd="underline"><u>U</u></button>
                  <button type="button" data-cmd="justifyLeft">Esquerda</button>
                  <button type="button" data-cmd="justifyCenter">Centralizar</button>
                  <button type="button" data-cmd="insertUnorderedList">• Lista</button>
                </div>
                <div id="contentBodyEditor" class="editor-content" contenteditable="true"></div>
              </div>

              <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn-action" id="btnSaveContent">Salvar Item</button>
                <button type="button" class="btn-action btn-secondary" id="btnCancelEdit" style="display: none;">Cancelar Edição</button>
              </div>
            </form>
          </div>

          <!-- TABELA ADMIN -->
          <div class="admin-box">
            <h3>📋 Itens Cadastrados</h3>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Tipo</th>
                    <th>Título</th>
                    <th>Status</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="adminContentTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast-msg">Operação realizada com sucesso!</div>

  <!-- MÓDULO FIREBASE E LÓGICA DO SISTEMA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, getDocs, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, ref, uploadBytes, getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // 1. CONFIGURAÇÃO DO FIREBASE (Substitua pelos seus dados)
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "seu-projeto.firebaseapp.com",
      projectId: "seu-projeto",
      storageBucket: "seu-projeto.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Estado da Aplicação
    let currentItems = [];
    let currentConfig = { title: "Projeto Escravo, Nem Pensar!", school: "CETI José Marques" };
    let currentAbout = "<h3>Sobre a Iniciativa</h3><p>Prevenção ao trabalho escravo nas escolas.</p>";
    let selectedCoverFile = null;
    let previousPage = 'home';

    // 2. NAVEGAÇÃO E INTERFACE
    const appContainer = document.getElementById('appContainer');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const navButtons = document.querySelectorAll('.nav-btn');
    const sections = document.querySelectorAll('.page-section');
    const backBtn = document.getElementById('backBtn');

    toggleSidebarBtn.addEventListener('click', () => {
      appContainer.classList.toggle('sidebar-collapsed');
    });

    function navigateTo(pageId) {
      sections.forEach(sec => sec.classList.remove('active'));
      const targetSection = document.getElementById(pageId + 'Page') || document.getElementById(pageId);
      if (targetSection) {
        targetSection.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      navButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === pageId);
      });
    }

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const page = btn.dataset.page;
        previousPage = page;
        navigateTo(page);
      });
    });

    backBtn.addEventListener('click', () => navigateTo(previousPage));

    // Editor de Texto Formatado
    document.querySelectorAll('.editor-toolbar button').forEach(button => {
      button.addEventListener('click', () => {
        const command = button.dataset.cmd;
        document.execCommand(command, false, null);
      });
    });

    // Preview de Capa
    document.getElementById('contentCoverFile').addEventListener('change', (e) => {
      selectedCoverFile = e.target.files[0];
      if (selectedCoverFile) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          document.getElementById('coverPreview').innerHTML = `<img src="${evt.target.result}" style="max-height:100px; border-radius:4px;">`;
        };
        reader.readAsDataURL(selectedCoverFile);
      }
    });

    // 3. OPERAÇÕES BANCO DE DADOS (FIREBASE)
    async function fetchAppData() {
      try {
        // Buscar Configurações
        const configDoc = await getDoc(doc(db, "settings", "general"));
        if (configDoc.exists()) {
          currentConfig = configDoc.data();
        }

        // Buscar Conteúdo Sobre
        const aboutDoc = await getDoc(doc(db, "settings", "about"));
        if (aboutDoc.exists()) {
          currentAbout = aboutDoc.data().content;
        }

        // Buscar Itens (Atividades e Materiais)
        const querySnapshot = await getDocs(collection(db, "items"));
        currentItems = [];
        querySnapshot.forEach((docSnap) => {
          currentItems.push({ id: docSnap.id, ...docSnap.data() });
        });

        renderApp();
      } catch (error) {
        console.error("Erro ao carregar dados: ", error);
        showToast("Erro ao conectar ao banco de dados.");
      }
    }

    function renderApp() {
      document.getElementById('heroTitleDisplay').textContent = currentConfig.title;
      document.getElementById('heroSchoolDisplay').textContent = currentConfig.school;
      document.getElementById('sidebarSchoolLabel').textContent = currentConfig.school;
      document.getElementById('aboutContentDisplay').innerHTML = currentAbout;

      document.getElementById('inputHeaderTitle').value = currentConfig.title;
      document.getElementById('inputSchoolName').value = currentConfig.school;
      document.getElementById('aboutEditor').innerHTML = currentAbout;

      const activities = currentItems.filter(i => i.type === 'activity');
      const materials = currentItems.filter(i => i.type === 'material');

      renderGrid('recentActivitiesGrid', activities.slice(0, 3));
      renderGrid('activitiesGrid', activities);
      renderGrid('materialsGrid', materials);
      renderAdminTable(currentItems);
    }

    function renderGrid(containerId, items) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p style="color: var(--texto-suave);">Nenhum item cadastrado.</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${item.cover ? `<img src="${item.cover}" class="card-img" alt="${item.title}">` : ''}
          <div class="card-body">
            <h3>${item.title}</h3>
            <p>${item.summary}</p>
            <button class="btn-action view-btn" data-id="${item.id}">Ver Detalhes</button>
          </div>
        `;
        container.appendChild(card);
      });

      container.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => viewDetail(btn.dataset.id));
      });
    }

    function viewDetail(id) {
      const item = currentItems.find(i => i.id === id);
      if (!item) return;

      document.getElementById('viewTitle').textContent = item.title;
      document.getElementById('viewCover').innerHTML = item.cover ? `<img src="${item.cover}" style="width:100%; max-height:400px; object-fit:cover; border-radius:8px; margin-bottom:20px;">` : '';
      document.getElementById('viewBody').innerHTML = item.body || item.summary;

      navigateTo('contentViewPage');
    }

    // 4. UPLOAD DE MÍDIA
    async function uploadCoverImage(file) {
      if (!file) return null;
      const storageRef = ref(storage, `covers/${Date.now()}_${file.name}`);
      const snapshot = await uploadBytes(storageRef, file);
      return       return await getDownloadURL(snapshot.ref);
    }

    // 5. ADMINISTRAÇÃO E AUTENTICAÇÃO
    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminLoginBox = document.getElementById('adminLoginBox');
    const adminPanel = document.getElementById('adminPanel');
    const logoutAdminBtn = document.getElementById('logoutAdminBtn');
    const contentForm = document.getElementById('contentForm');
    const btnCancelEdit = document.getElementById('btnCancelEdit');

    // Login simples (Apenas para demonstração no front-end)
    adminLoginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('adminPassword').value;
      
      // Defina sua senha de acesso aqui
      if (pass === "admin123") {
        adminLoginBox.style.display = 'none';
        adminPanel.style.display = 'block';
        showToast("Acesso concedido!");
      } else {
        showToast("Senha incorreta!");
      }
    });

    logoutAdminBtn.addEventListener('click', () => {
      adminPanel.style.display = 'none';
      adminLoginBox.style.display = 'block';
      document.getElementById('adminPassword').value = '';
      resetForm();
      showToast("Sessão encerrada.");
    });

    // Salvar Configurações Gerais
    document.getElementById('btnSaveConfig').addEventListener('click', async () => {
      const title = document.getElementById('inputHeaderTitle').value;
      const school = document.getElementById('inputSchoolName').value;

      try {
        await setDoc(doc(db, "settings", "general"), { title, school });
        currentConfig = { title, school };
        renderApp();
        showToast("Configurações atualizadas!");
      } catch (error) {
        console.error("Erro ao salvar configurações:", error);
        showToast("Erro ao salvar alterações.");
      }
    });

    // Salvar Conteúdo da Página Sobre
    document.getElementById('btnSaveAbout').addEventListener('click', async () => {
      const content = document.getElementById('aboutEditor').innerHTML;

      try {
        await setDoc(doc(db, "settings", "about"), { content });
        currentAbout = content;
        renderApp();
        showToast("Página 'Sobre' atualizada!");
      } catch (error) {
        console.error("Erro ao salvar Sobre:", error);
        showToast("Erro ao salvar alterações.");
      }
    });

    // Salvar/Editar Atividade ou Material
    contentForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('contentId').value;
      const type = document.getElementById('contentType').value;
      const title = document.getElementById('contentTitle').value;
      const status = document.getElementById('contentStatus').value;
      const summary = document.getElementById('contentSummary').value;
      const body = document.getElementById('contentBodyEditor').innerHTML;

      const btnSubmit = document.getElementById('btnSaveContent');
      btnSubmit.disabled = true;
      btnSubmit.textContent = "Salvando...";

      try {
        let coverUrl = null;

        if (selectedCoverFile) {
          coverUrl = await uploadCoverImage(selectedCoverFile);
        }

        const dataPayload = {
          type,
          title,
          status,
          summary,
          body,
          updatedAt: new Date()
        };

        if (coverUrl) {
          dataPayload.cover = coverUrl;
        }

        if (id) {
          // Atualizar Item Existente
          await updateDoc(doc(db, "items", id), dataPayload);
          showToast("Item atualizado com sucesso!");
        } else {
          // Criar Novo Item
          dataPayload.createdAt = new Date();
          if (!coverUrl) dataPayload.cover = "";
          await addDoc(collection(db, "items"), dataPayload);
          showToast("Item cadastrado com sucesso!");
        }

        resetForm();
        await fetchAppData();
      } catch (error) {
        console.error("Erro ao salvar item:", error);
        showToast("Erro ao processar requisição.");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Salvar Item";
      }
    });

    function resetForm() {
      document.getElementById('contentId').value = '';
      document.getElementById('contentForm').reset();
      document.getElementById('contentBodyEditor').innerHTML = '';
      document.getElementById('coverPreview').innerHTML = '';
      document.getElementById('formContentTitle').textContent = '➕ Cadastrar Nova Atividade / Material';
      btnCancelEdit.style.display = 'none';
      selectedCoverFile = null;
    }

    btnCancelEdit.addEventListener('click', resetForm);

    // Renderizar Tabela Administrativa
    function renderAdminTable(items) {
      const tbody = document.getElementById('adminContentTable');
      tbody.innerHTML = '';

      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum registro encontrado.</td></tr>';
        return;
      }

      items.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.type === 'activity' ? 'Atividade' : 'Material'}</td>
          <td><strong>${item.title}</strong></td>
          <td>${item.type === 'activity' ? item.status : 'N/A'}</td>
          <td>
            <button class="btn-action edit-btn" data-id="${item.id}" style="padding: 4px 8px; font-size: 0.8rem;">Editar</button>
            <button class="btn-action btn-danger delete-btn" data-id="${item.id}" style="padding: 4px 8px; font-size: 0.8rem;">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Eventos de Editar e Excluir
      tbody.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => editItem(btn.dataset.id));
      });

      tbody.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteItem(btn.dataset.id));
      });
    }

    // Carregar Dados no Formulário para Edição
    function editItem(id) {
      const item = currentItems.find(i => i.id === id);
      if (!item) return;

      document.getElementById('contentId').value = item.id;
      document.getElementById('contentType').value = item.type;
      document.getElementById('contentTitle').value = item.title;
      document.getElementById('contentStatus').value = item.status || 'concluido';
      document.getElementById('contentSummary').value = item.summary;
      document.getElementById('contentBodyEditor').innerHTML = item.body || '';
      
      if (item.cover) {
        document.getElementById('coverPreview').innerHTML = `<img src="${item.cover}" style="max-height:100px; border-radius:4px;">`;
      } else {
        document.getElementById('coverPreview').innerHTML = '';
      }

      document.getElementById('formContentTitle').textContent = '✏️ Editar Item';
      btnCancelEdit.style.display = 'inline-block';

      // Scroll até o formulário de edição
      document.getElementById('formContentTitle').scrollIntoView({ behavior: 'smooth' });
    }

    // Excluir Item
    async function deleteItem(id) {
      if (confirm("Tem certeza que deseja excluir este item permanentemente?")) {
        try {
          await deleteDoc(doc(db, "items", id));
          showToast("Item excluído com sucesso!");
          await fetchAppData();
        } catch (error) {
          console.error("Erro ao excluir:", error);
          showToast("Erro ao excluir o item.");
        }
      }
    }

    // 6. CAMPO DE BUSCA (FILTRO EM TEMPO REAL)
    function setupSearch(inputId, targetGridId, type) {
      const input = document.getElementById(inputId);
      input.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = currentItems.filter(item => {
          const isCorrectType = type ? item.type === type : true;
          const matchesTitle = item.title.toLowerCase().includes(term);
          const matchesSummary = item.summary.toLowerCase().includes(term);
          return isCorrectType && (matchesTitle || matchesSummary);
        });
        renderGrid(targetGridId, filtered);
      });
    }

    setupSearch('homeSearchInput', 'recentActivitiesGrid', 'activity');
    setupSearch('actSearchInput', 'activitiesGrid', 'activity');

    // 7. MENSAGEM TOAST (NOTIFICAÇÃO)
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // 8. INICIALIZAÇÃO DA APLICAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
      fetchAppData();
    });
  </script>
</body>
</html>
