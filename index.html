<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Conteúdos</title>
  <style>
    :root {
      --bg-principal: #f4f6f8;
      --bg-card: #ffffff;
      --texto-principal: #1a1a1a;
      --texto-secundario: #666666;
      --cor-primaria: #0066cc;
      --cor-borda: #e0e0e0;
      --sidebar-width: 250px;
    }

    [data-theme="dark"] {
      --bg-principal: #121212;
      --bg-card: #1e1e1e;
      --texto-principal: #ffffff;
      --texto-secundario: #aaa;
      --cor-primaria: #3794ff;
      --cor-borda: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-principal); color: var(--texto-principal); display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar { width: var(--sidebar-width); background: var(--bg-card); border-right: 1px solid var(--cor-borda); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1rem; transition: transform 0.3s ease; }
    .nav-item { padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; color: var(--texto-secundario); font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
    .nav-item:hover, .nav-item.active { background: rgba(0, 102, 204, 0.1); color: var(--cor-primaria); }

    /* MAIN CONTENT */
    .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    
    /* PAGES */
    .page { display: none; }
    .page.active { display: block; }

    /* CARDS GRID */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .window-card { background: var(--bg-card); border: 1px solid var(--cor-borda); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .window-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    .window-header { background: rgba(0,0,0,0.05); padding: 0.5rem 1rem; display: flex; justify-content: space-between; font-size: 0.8rem; border-bottom: 1px solid var(--cor-borda); }
    .card-cover-img { width: 100%; height: 160px; object-fit: cover; }
    .window-body { padding: 1rem; }
    .window-title { margin-bottom: 0.5rem; font-size: 1.1rem; }
    .window-desc { font-size: 0.9rem; color: var(--texto-secundario); }

    /* INPUTS & BUTTONS */
    input, select, textarea { width: 100%; padding: 0.75rem; margin-top: 0.5rem; margin-bottom: 1rem; border: 1px solid var(--cor-borda); border-radius: 6px; background: var(--bg-card); color: var(--texto-principal); }
    button { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; background: var(--cor-primaria); color: white; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: transparent; border: 1px solid var(--cor-borda); color: var(--texto-principal); }
    .btn-action { padding: 0.4rem 0.8rem; font-size: 0.85rem; margin-right: 0.25rem; }

    /* EDITOR WYSIWYG */
    .editor-toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; padding: 0.5rem; background: rgba(0,0,0,0.05); border: 1px solid var(--cor-borda); border-bottom: none; border-radius: 6px 6px 0 0; }
    .editor-toolbar button { padding: 0.25rem 0.5rem; background: var(--bg-card); color: var(--texto-principal); border: 1px solid var(--cor-borda); }
    .editor-content { min-height: 200px; border: 1px solid var(--cor-borda); border-radius: 0 0 6px 6px; padding: 1rem; background: var(--bg-card); margin-bottom: 1rem; }

    /* TABELA ADMIN */
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--cor-borda); }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; transform: translateY(-100%); position: absolute; z-index: 100; }
      body.sidebar-open .sidebar { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- NAVEGAÇÃO LATERAL -->
  <aside class="sidebar">
    <h2>Painel</h2>
    <div class="nav-item active" data-target="home">🏠 Início</div>
    <div class="nav-item" data-target="admin">⚙️ Administração</div>
    <button id="btnToggleTheme" class="btn-secondary" style="margin-top: auto;">Modo Escuro</button>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-content">
    <div class="header-bar">
      <button id="btnToggleSidebar" class="btn-secondary">☰ Menu</button>
      <input type="text" id="searchInput" placeholder="Pesquisar conteúdo..." style="max-width: 300px; margin: 0;" oninput="window.App.handleSearch()">
    </div>

    <!-- PÁGINA: INÍCIO (CARDS) -->
    <section id="home" class="page active">
      <h1 style="margin-bottom: 1.5rem;">Conteúdos Publicados</h1>
      <div id="cardsContainer" class="cards-grid"></div>
    </section>

    <!-- PÁGINA: LEITOR DE CONTEÚDO -->
    <section id="contentView" class="page">
      <button class="btn-secondary" onclick="window.App.navigateTo('home')" style="margin-bottom: 1rem;">← Voltar</button>
      <h1 id="viewTitle"></h1>
      <div id="viewCoverContainer"></div>
      <div id="viewBody" style="margin-top: 1.5rem; line-height: 1.6;"></div>
    </section>

    <!-- PÁGINA: PAINEL ADMINISTRATIVO -->
    <section id="admin" class="page">
      <!-- TELA DE LOGIN -->
      <div id="adminLoginBox" style="max-width: 400px; margin: 2rem auto; text-align: center;">
        <h2>Acesso Restrito</h2>
        <form id="loginForm">
          <input type="password" id="inputPassword" placeholder="Digite a senha (admin123)" required>
          <button type="submit" style="width: 100%;">Entrar</button>
        </form>
      </div>

      <!-- PAINEL COMPLETO -->
      <div id="adminPanel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1>Gerenciador de Módulos</h1>
          <button class="btn-secondary" onclick="window.App.logoutAdmin()">Sair</button>
        </div>

        <!-- ESTATÍSTICAS -->
        <div style="display: flex; gap: 1rem; margin: 1.5rem 0;">
          <div style="padding: 1rem; background: var(--bg-card); border: 1px solid var(--cor-borda); border-radius: 8px; flex: 1;">
            <small>Total</small>
            <h2 id="statTotal">0</h2>
          </div>
          <div style="padding: 1rem; background: var(--bg-card); border: 1px solid var(--cor-borda); border-radius: 8px; flex: 1;">
            <small>Publicados</small>
            <h2 id="statPublished">0</h2>
          </div>
          <div style="padding: 1rem; background: var(--bg-card); border: 1px solid var(--cor-borda); border-radius: 8px; flex: 1;">
            <small>Rascunhos</small>
            <h2 id="statDrafts">0</h2>
          </div>
        </div>

        <!-- FORMULÁRIO -->
        <div style="background: var(--bg-card); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--cor-borda);">
          <h3 id="formTitle">➕ Criar Novo Conteúdo</h3>
          <form id="contentForm">
            <input type="hidden" id="editId">
            <input type="hidden" id="currentCoverUrl">

            <label>Título</label>
            <input type="text" id="inputTitle" required>

            <label>Descrição Breve</label>
            <input type="text" id="inputDesc" required>

            <label>Status</label>
            <select id="inputStatus">
              <option value="Publicado">Publicado</option>
              <option value="Rascunho">Rascunho</option>
            </select>

            <label>Imagem de Capa</label>
            <input type="file" id="coverInput" accept="image/*">
            <div id="coverPreviewContainer"></div>

            <label>Conteúdo Principal</label>
            <div class="editor-toolbar">
              <button type="button" onclick="window.App.execEditorCmd('bold')"><b>B</b></button>
              <button type="button" onclick="window.App.execEditorCmd('italic')"><i>I</i></button>
              <button type="button" onclick="window.App.execEditorCmd('insertUnorderedList')">• Lista</button>
              <button type="button" onclick="window.App.triggerImageUpload()">📷 Inserir Imagem</button>
              <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="window.App.handleImageUpload(event)">
            </div>
            <div id="editorContent" class="editor-content" contenteditable="true"></div>

            <button type="submit" id="btnSubmitForm">Salvar Conteúdo</button>
            <button type="button" id="btnCancelEdit" class="btn-secondary" style="display: none;" onclick="window.App.resetForm()">Cancelar</button>
          </form>
        </div>

        <!-- TABELA -->
        <h3 style="margin-top: 2rem;">Lista de Conteúdos</h3>
        <table>
          <thead>
            <tr>
              <th>Capa</th>
              <th>Título</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- FIREBASE SDKs & LÓGICA JAVASCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, ref, uploadBytes, getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAuk38nS6xqUjz-6sYL9Tkaf5iGYqMs-sA",
      authDomain: "escravonempensar-d87c3.firebaseapp.com",
      databaseURL: "https://escravonempensar-d87c3-default-rtdb.firebaseio.com",
      projectId: "escravonempensar-d87c3",
      storageBucket: "escravonempensar-d87c3.firebasestorage.app",
      messagingSenderId: "132266908384",
      appId: "1:132266908384:web:b0b5c2023a090d5cea8e85",
      measurementId: "G-7QJ9XL751E"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const contentsRef = collection(db, "contents");

    /* REPOSITÓRIO FIRESTORE / STORAGE */
    const ContentRepository = {
      subscribe(callback) {
        return onSnapshot(contentsRef, (snapshot) => {
          const contents = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          callback(contents);
        }, (error) => {
          console.error("Erro na sincronização:", error);
        });
      },

      async uploadFile(file, path) {
        try {
          const storageRef = ref(storage, `${path}/${Date.now()}_${file.name}`);
          await uploadBytes(storageRef, file);
          return await getDownloadURL(storageRef);
        } catch (err) {
          console.error("Erro no upload do arquivo:", err);
          throw err;
        }
      },

      async create(data) {
        return await addDoc(contentsRef, {
          ...data,
          createdAt: serverTimestamp()
        });
      },

      async update(id, data) {
        const docRef = doc(db, "contents", id);
        return await updateDoc(docRef, data);
      },

      async delete(id) {
        const docRef = doc(db, "contents", id);
        return await deleteDoc(docRef);
      }
    };

    /* ESTADO E MÉTODOS DE INTERFACE */
    let contents = [];
    let filteredContents = [];

    function initFirebaseListener() {
      ContentRepository.subscribe((data) => {
        contents = data;
        filteredContents = [...contents];
        renderCards();
        renderAdminTable();
        updateStats();
      });
    }

    function navigateTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

      const targetPage = document.getElementById(pageId);
      if (targetPage) targetPage.classList.add('active');

      const navLink = document.querySelector(`.nav-item[data-target="${pageId}"]`);
      if (navLink) navLink.classList.add('active');

      if (window.innerWidth <= 768) {
        document.body.classList.remove('sidebar-open');
      }
    }

    function initTheme() {
      const btnTheme = document.getElementById('btnToggleTheme');
      if (btnTheme) {
        btnTheme.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          btnTheme.textContent = next === 'light' ? 'Modo Escuro' : 'Modo Claro';
        });
      }
    }

    function initSidebar() {
      const btnToggle = document.getElementById('btnToggleSidebar');
      if (btnToggle) {
        btnToggle.addEventListener('click', toggleSidebar);
      }

      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => navigateTo(item.dataset.target));
      });
    }

    function toggleSidebar() {
      if (window.innerWidth <= 768) {
        document.body.classList.toggle('sidebar-open');
      } else {
        document.body.classList.toggle('sidebar-collapsed');
      }
    }

    function handleSearch() {
      const searchInput = document.getElementById('searchInput');
      if (!searchInput) return;
      const query = searchInput.value.toLowerCase().trim();
      filteredContents = contents.filter(item => 
        (item.title && item.title.toLowerCase().includes(query)) || 
        (item.desc && item.desc.toLowerCase().includes(query))
      );
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      if (!container) return;
      container.innerHTML = '';

      const published = filteredContents.filter(item => item.status === 'Publicado');

      if (published.length === 0) {
        container.innerHTML = '<p style="color: var(--texto-secundario);">Nenhum conteúdo encontrado.</p>';
        return;
      }

      published.forEach(item => {
        const card = document.createElement('div');
        card.className = 'window-card';
        
        const coverHtml = item.coverUrl 
          ? `<img src="${item.coverUrl}" alt="${item.title}" class="card-cover-img">`
          : '';

        card.innerHTML = `
          <div class="window-header">
            <span>Módulo</span>
            <span>🗔</span>
          </div>
          ${coverHtml}
          <div class="window-body">
            <h3 class="window-title">${item.title || ''}</h3>
            <p class="window-desc">${item.desc || ''}</p>
          </div>
        `;
        card.onclick = () => openContent(item.id);
        container.appendChild(card);
      });
    }

    function openContent(id) {
      const item = contents.find(c => c.id === id);
      if (!item) return;

      document.getElementById('viewTitle').textContent = item.title || '';
      
      const coverContainer = document.getElementById('viewCoverContainer');
      if (item.coverUrl) {
        coverContainer.innerHTML = `<img src="${item.coverUrl}" style="max-width:100%; height:auto; border-radius:8px; margin-top:1rem;">`;
      } else {
        coverContainer.innerHTML = '';
      }

      document.getElementById('viewBody').innerHTML = item.body || '<p style="color:var(--texto-secundario)">Conteúdo sem texto.</p>';
      navigateTo('contentView');
    }

    function updateStats() {
      const statTotal = document.getElementById('statTotal');
      const statPublished = document.getElementById('statPublished');
      const statDrafts = document.getElementById('statDrafts');

      if (statTotal) statTotal.textContent = contents.length;
      if (statPublished) statPublished.textContent = contents.filter(c => c.status === 'Publicado').length;
      if (statDrafts) statDrafts.textContent = contents.filter(c => c.status === 'Rascunho').length;
    }

    function initAdmin() {
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const pass = document.getElementById('inputPassword').value;
          if (pass === 'admin123') {
            document.getElementById('adminLoginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('inputPassword').value = '';
          } else {
            alert('Senha incorreta!');
          }
        });
      }

      const form = document.getElementById('contentForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const btnSubmit = document.getElementById('btnSubmitForm');
          btnSubmit.disabled = true;
          btnSubmit.textContent = 'Salvando...';

          try {
            const editId = document.getElementById('editId').value;
            const title = document.getElementById('inputTitle').value;
            const desc = document.getElementById('inputDesc').value;
            const status = document.getElementById('inputStatus').value;
            const body = document.getElementById('editorContent').innerHTML;
            let coverUrl = document.getElementById('currentCoverUrl').value || '';

            const coverInput = document.getElementById('coverInput');
            if (coverInput.files && coverInput.files[0]) {
              coverUrl = await ContentRepository.uploadFile(coverInput.files[0], 'covers');
            }

            const payload = { title, desc, status, body, coverUrl };

            if (editId) {
              await ContentRepository.update(editId, payload);
            } else {
              await ContentRepository.create(payload);
            }

            alert('Conteúdo salvo com sucesso!');
            resetForm();
          } catch (err) {
            console.error(err);
            alert('Erro ao salvar no banco de dados. Verifique a conexão.');
          } finally {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Salvar Conteúdo';
          }
        });
      }
    }

    function logoutAdmin() {
      document.getElementById('adminLoginBox').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
    }

    function renderAdminTable() {
      const tbody = document.getElementById('adminTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      contents.forEach(item => {
        const tr = document.createElement('tr');
        const coverThumb = item.coverUrl 
          ? `<img src="${item.coverUrl}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">`
          : '—';

        tr.innerHTML = `
          <td>${coverThumb}</td>
          <td><strong>${item.title || ''}</strong></td>
          <td>${item.status || ''}</td>
          <td>
            <button class="btn-action btn-secondary" onclick="window.App.editItem('${item.id}')">✏️ Editar</button>
            <button class="btn-action btn-secondary" onclick="window.App.deleteItem('${item.id}')">🗑️ Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function editItem(id) {
      const item = contents.find(c => c.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('inputTitle').value = item.title || '';
      document.getElementById('inputDesc').value = item.desc || '';
      document.getElementById('inputStatus').value = item.status || 'Publicado';
      document.getElementById('editorContent').innerHTML = item.body || '';
      document.getElementById('currentCoverUrl').value = item.coverUrl || '';

      const preview = document.getElementById('coverPreviewContainer');
      if (item.coverUrl) {
        preview.innerHTML = `<img src="${item.coverUrl}" style="height:60px; border-radius:4px;">`;
      } else {
        preview.innerHTML = '';
      }

      document.getElementById('formTitle').textContent = '✏️ Editar Conteúdo';
      document.getElementById('btnCancelEdit').style.display = 'inline-block';
    }

    async function deleteItem(id) {
      if (confirm('Deseja realmente excluir este conteúdo permanentemente?')) {
        try {
          await ContentRepository.delete(id);
        } catch (err) {
          console.error(err);
          alert('Erro ao excluir o item.');
        }
      }
    }

    function resetForm() {
      document.getElementById('contentForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('currentCoverUrl').value = '';
      document.getElementById('coverPreviewContainer').innerHTML = '';
      document.getElementById('editorContent').innerHTML = '';
      document.getElementById('formTitle').textContent = '➕ Criar Novo Conteúdo';
      document.getElementById('btnCancelEdit').style.display = 'none';
    }

    function execEditorCmd(command, value = null) {
      document.execCommand(command, false, value);
    }

    function triggerImageUpload() {
      document.getElementById('imageInput').click();
    }

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        try {
          const url = await ContentRepository.uploadFile(file, 'editor_images');
          execEditorCmd('insertImage', url);
        } catch (err) {
          console.error(err);
          alert('Erro ao enviar imagem no editor.');
        }
      }
    }

    /* VINCULAÇÃO GLOBAL DAS FUNÇÕES AO OBJETO WINDOW */
    window.App = {
      navigateTo,
      toggleSidebar,
      handleSearch,
      logoutAdmin,
      editItem,
      deleteItem,
      resetForm,
      execEditorCmd,
      triggerImageUpload,
      handleImageUpload
    };

    /* INICIALIZAÇÃO APÓS CARREGAR O DOM */
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initSidebar();
      initAdmin();
      initFirebaseListener();
    });
  </script>
</body>
</html>
