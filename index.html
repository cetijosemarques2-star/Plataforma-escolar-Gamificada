<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Atividades</title>
  <style>
    :root {
      --bg-principal: #f4f6f8;
      --bg-card: #ffffff;
      --texto-principal: #1a1a1a;
      --texto-secundario: #666666;
      --cor-primaria: #0066cc;
      --cor-borda: #dddddd;
    }

    [data-theme="dark"] {
      --bg-principal: #121212;
      --bg-card: #1e1e1e;
      --texto-principal: #f4f6f8;
      --texto-secundario: #aaa;
      --cor-primaria: #3794ff;
      --cor-borda: #333333;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-principal);
      color: var(--texto-principal);
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: var(--bg-card);
      border-right: 1px solid var(--cor-borda);
      padding: 1rem;
      box-sizing: border-box;
    }

    .main-content {
      flex: 1;
      padding: 2rem;
      box-sizing: border-box;
    }

    .page { display: none; }
    .page.active { display: block; }

    .nav-item {
      display: block;
      padding: 0.75rem 1rem;
      color: var(--texto-principal);
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }

    .nav-item.active, .nav-item:hover {
      background-color: var(--cor-primaria);
      color: white;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .window-card {
      background: var(--bg-card);
      border: 1px solid var(--cor-borda);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .window-header {
      background: #eee;
      padding: 0.5rem 1rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #333;
    }

    .card-cover-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .window-body { padding: 1rem; }
    .window-title { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
    .window-desc { margin: 0; color: var(--texto-secundario); font-size: 0.9rem; }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .form-control {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--cor-borda);
      border-radius: 4px;
      box-sizing: border-box;
      background: var(--bg-card);
      color: var(--texto-principal);
    }

    .editor-box {
      min-height: 150px;
      border: 1px solid var(--cor-borda);
      padding: 0.75rem;
      border-radius: 4px;
      background: var(--bg-card);
    }

    .toolbar {
      margin-bottom: 0.5rem;
      display: flex;
      gap: 0.25rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      background: var(--cor-primaria);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #6c757d; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      border: 1px solid var(--cor-borda);
      padding: 0.75rem;
      text-align: left;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h2>Painel</h2>
    <nav>
      <div class="nav-item active" data-target="homeView" onclick="App.navigateTo('homeView')">🏠 Início</div>
      <div class="nav-item" data-target="adminView" onclick="App.navigateTo('adminView')">⚙️ Administração</div>
    </nav>
    <br>
    <button class="btn btn-secondary" id="btnToggleTheme" onclick="App.toggleTheme()">Modo Escuro</button>
  </aside>

  <main class="main-content">
    
    <!-- PÁGINA INICIAL / CARDS -->
    <section id="homeView" class="page active">
      <h1>Atividades e Conteúdos</h1>
      <input type="text" id="searchInput" class="form-control" placeholder="Buscar conteúdos..." oninput="App.handleSearch()" style="max-width: 300px; margin-bottom: 1rem;">
      <div id="cardsContainer" class="cards-grid"></div>
    </section>

    <!-- PÁGINA VISUALIZAR CONTEÚDO -->
    <section id="contentView" class="page">
      <button class="btn btn-secondary" onclick="App.navigateTo('homeView')">← Voltar</button>
      <h1 id="viewTitle" style="margin-top: 1rem;"></h1>
      <div id="viewCoverContainer"></div>
      <div id="viewBody" style="margin-top: 1.5rem;"></div>
    </section>

    <!-- PÁGINA DE ADMINISTRAÇÃO -->
    <section id="adminView" class="page">
      <h1>Administração de Conteúdo</h1>

      <!-- LOGIN CAIXA -->
      <div id="adminLoginBox" style="max-width: 350px; background: var(--bg-card); padding: 1.5rem; border: 1px solid var(--cor-borda); border-radius: 8px;">
        <h3>Acesso Restrito</h3>
        <form id="loginForm">
          <div class="form-group">
            <label for="inputPassword">Senha de Acesso</label>
            <!-- Tipo password para esconder os caracteres -->
            <input type="password" id="inputPassword" class="form-control" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn">Entrar</button>
        </form>
      </div>

      <!-- PAINEL ADMIN (OCULTO INICIALMENTE) -->
      <div id="adminPanel" style="display: none;">
        <button class="btn btn-secondary" onclick="App.logoutAdmin()">Sair do Painel</button>
        
        <div style="display: flex; gap: 2rem; margin-top: 1rem;">
          <p>Total: <strong id="statTotal">0</strong></p>
          <p>Publicados: <strong id="statPublished">0</strong></p>
          <p>Rascunhos: <strong id="statDrafts">0</strong></p>
        </div>

        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--cor-borda);">

        <!-- FORMULÁRIO DE CONTEÚDO -->
        <h2 id="formTitle">➕ Criar Novo Conteúdo</h2>
        <form id="contentForm">
          <input type="hidden" id="editId">
          <input type="hidden" id="currentCoverUrl">

          <div class="form-group">
            <label>Título</label>
            <input type="text" id="inputTitle" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Descrição Curta</label>
            <input type="text" id="inputDesc" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Status</label>
            <select id="inputStatus" class="form-control">
              <option value="Publicado">Publicado</option>
              <option value="Rascunho">Rascunho</option>
            </select>
          </div>

          <div class="form-group">
            <label>Imagem de Capa</label>
            <input type="file" id="coverInput" class="form-control" accept="image/*">
            <div id="coverPreviewContainer" style="margin-top: 0.5rem;"></div>
          </div>

          <div class="form-group">
            <label>Corpo do Conteúdo</label>
            <div class="toolbar">
              <button type="button" class="btn btn-secondary" onclick="App.execEditorCmd('bold')"><b>B</b></button>
              <button type="button" class="btn btn-secondary" onclick="App.execEditorCmd('italic')"><i>I</i></button>
              <button type="button" class="btn btn-secondary" onclick="App.execEditorCmd('insertUnorderedList')">• Lista</button>
              <button type="button" class="btn btn-secondary" onclick="App.triggerImageUpload()">🖼️ Add Imagem</button>
              <input type="file" id="imageInput" style="display:none;" accept="image/*" onchange="App.handleImageUpload(event)">
            </div>
            <div id="editorContent" class="editor-box" contenteditable="true"></div>
          </div>

          <button type="submit" id="btnSubmitForm" class="btn">Salvar Conteúdo</button>
          <button type="button" id="btnCancelEdit" class="btn btn-secondary" style="display:none;" onclick="App.resetForm()">Cancelar</button>
        </form>

        <h2 style="margin-top: 2.5rem;">Conteúdos Cadastrados</h2>
        <table>
          <thead>
            <tr>
              <th>Capa</th>
              <th>Título</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- SDK Firebase Versão 9+ via CDN (Nativo / Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // INSIRA AS SUAS CONFIGURAÇÕES DO FIREBASE CONSOLE AQUI
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Hash SHA-256 da senha 'admin123'
    const ADMIN_PASSWORD_HASH = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";

    async function hashPassword(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    // Repositório de Dados
    window.ContentRepository = {
      subscribe(callback) {
        return onSnapshot(collection(db, "contents"), (snapshot) => {
          const list = snapshot.docs.map(docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          }));
          callback(list);
        });
      },
      async create(data) {
        return await addDoc(collection(db, "contents"), data);
      },
      async update(id, data) {
        const docRef = doc(db, "contents", id);
        return await updateDoc(docRef, data);
      },
      async delete(id) {
        const docRef = doc(db, "contents", id);
        return await deleteDoc(docRef, id);
      },
      async uploadFile(file, path) {
        const fileRef = ref(storage, `${path}/${Date.now()}_${file.name}`);
        const snapshot = await uploadBytes(fileRef, file);
        return await getDownloadURL(snapshot.ref);
      }
    };

    let contents = [];
    let filteredContents = [];

    function initFirebaseListener() {
      ContentRepository.subscribe((data) => {
        contents = data;
        filteredContents = [...contents];
        renderCards();
        renderAdminTable();
        updateStats();
      });
    }

    function navigateTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

      const targetPage = document.getElementById(pageId);
      if (targetPage) targetPage.classList.add('active');

      const navLink = document.querySelector(`.nav-item[data-target="${pageId}"]`);
      if (navLink) navLink.classList.add('active');
    }

    function toggleTheme() {
      const btnTheme = document.getElementById('btnToggleTheme');
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      btnTheme.textContent = next === 'light' ? 'Modo Escuro' : 'Modo Claro';
    }

    function handleSearch() {
      const searchInput = document.getElementById('searchInput');
      if (!searchInput) return;
      const query = searchInput.value.toLowerCase().trim();
      filteredContents = contents.filter(item => 
        (item.title && item.title.toLowerCase().includes(query)) || 
        (item.desc && item.desc.toLowerCase().includes(query))
      );
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      if (!container) return;
      container.innerHTML = '';

      const published = filteredContents.filter(item => item.status === 'Publicado');

      if (published.length === 0) {
        container.innerHTML = '<p style="color: var(--texto-secundario);">Nenhum conteúdo publicado encontrado.</p>';
        return;
      }

      published.forEach(item => {
        const card = document.createElement('div');
        card.className = 'window-card';
        
        const coverHtml = item.coverUrl 
          ? `<img src="${item.coverUrl}" alt="${item.title}" class="card-cover-img">`
          : '';

        card.innerHTML = `
          <div class="window-header">
            <span>Atividade</span>
            <span>🗔</span>
          </div>
          ${coverHtml}
          <div class="window-body">
            <h3 class="window-title">${item.title || ''}</h3>
            <p class="window-desc">${item.desc || ''}</p>
          </div>
        `;
        card.onclick = () => openContent(item.id);
        container.appendChild(card);
      });
    }

    function openContent(id) {
      const item = contents.find(c => c.id === id);
      if (!item) return;

      document.getElementById('viewTitle').textContent = item.title || '';
      
      const coverContainer = document.getElementById('viewCoverContainer');
      if (item.coverUrl) {
        coverContainer.innerHTML = `<img src="${item.coverUrl}" style="max-width:100%; height:auto; border-radius:8px; margin-top:1rem;">`;
      } else {
        coverContainer.innerHTML = '';
      }

      document.getElementById('viewBody').innerHTML = item.body || '<p style="color:var(--texto-secundario)">Conteúdo sem texto.</p>';
      navigateTo('contentView');
    }

    function updateStats() {
      const statTotal = document.getElementById('statTotal');
      const statPublished = document.getElementById('statPublished');
      const statDrafts = document.getElementById('statDrafts');

      if (statTotal) statTotal.textContent = contents.length;
      if (statPublished) statPublished.textContent = contents.filter(c => c.status === 'Publicado').length;
      if (statDrafts) statDrafts.textContent = contents.filter(c => c.status === 'Rascunho').length;
    }

    function initAdmin() {
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const passInput = document.getElementById('inputPassword').value;
          const hashedInput = await hashPassword(passInput);

          if (hashedInput === ADMIN_PASSWORD_HASH) {
            document.getElementById('adminLoginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('inputPassword').value = '';
          } else {
            alert('Senha incorreta!');
          }
        });
      }

      const form = document.getElementById('contentForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const btnSubmit = document.getElementById('btnSubmitForm');
          btnSubmit.disabled = true;
          btnSubmit.textContent = 'Salvando...';

          try {
            const editId = document.getElementById('editId').value;
            const title = document.getElementById('inputTitle').value;
            const desc = document.getElementById('inputDesc').value;
            const status = document.getElementById('inputStatus').value;
            const body = document.getElementById('editorContent').innerHTML;
            let coverUrl = document.getElementById('currentCoverUrl').value || '';

            const coverInput = document.getElementById('coverInput');
            if (coverInput.files && coverInput.files[0]) {
              coverUrl = await ContentRepository.uploadFile(coverInput.files[0], 'covers');
            }

            const payload = { title, desc, status, body, coverUrl };

            if (editId) {
              await ContentRepository.update(editId, payload);
            } else {
              await ContentRepository.create(payload);
            }

            alert('Conteúdo salvo com sucesso!');
            resetForm();
          } catch (err) {
            console.error(err);
            alert('Erro ao salvar no banco de dados. Verifique a conexão e as regras do Firebase.');
          } finally {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Salvar Conteúdo';
          }
        });
      }
    }

    function logoutAdmin() {
      document.getElementById('adminLoginBox').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
    }

    function renderAdminTable() {
      const tbody = document.getElementById('adminTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      contents.forEach(item => {
        const tr = document.createElement('tr');
        const coverThumb = item.coverUrl 
          ? `<img src="${item.coverUrl}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">`
          : '—';

        tr.innerHTML = `
          <td>${coverThumb}</td>
          <td><strong>${item.title || ''}</strong></td>
          <td>${item.status || ''}</td>
          <td>
            <button class="btn btn-secondary" onclick="App.editItem('${item.id}')">✏️ Editar</button>
            <button class="btn btn-secondary" onclick="App.deleteItem('${item.id}')">🗑️ Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function editItem(id) {
      const item = contents.find(c => c.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('inputTitle').value = item.title || '';
      document.getElementById('inputDesc').value = item.desc || '';
      document.getElementById('inputStatus').value = item.status || 'Publicado';
      document.getElementById('editorContent').innerHTML = item.body || '';
      document.getElementById('currentCoverUrl').value = item.coverUrl || '';

      const preview = document.getElementById('coverPreviewContainer');
      if (item.coverUrl) {
        preview.innerHTML = `<img src="${item.coverUrl}" style="height:60px; border-radius:4px;">`;
      } else {
        preview.innerHTML = '';
      }

      document.getElementById('formTitle').textContent = '✏️ Editar Conteúdo';
      document.getElementById('btnCancelEdit').style.display = 'inline-block';
    }

    async function deleteItem(id) {
      if (confirm('Deseja realmente excluir este conteúdo permanentemente?')) {
        try {
          await ContentRepository.delete(id);
        } catch (err) {
          console.error(err);
          alert('Erro ao excluir o item.');
        }
      }
    }

    function resetForm() {
      document.getElementById('contentForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('currentCoverUrl').value = '';
      document.getElementById('coverPreviewContainer').innerHTML = '';
      document.getElementById('editorContent').innerHTML = '';
      document.getElementById('formTitle').textContent = '➕ Criar Novo Conteúdo';
      document.getElementById('btnCancelEdit').style.display = 'none';
    }

    function execEditorCmd(command, value = null) {
      document.execCommand(command, false, value);
    }

    function triggerImageUpload() {
      document.getElementById('imageInput').click();
    }

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        try {
          const url = await ContentRepository.uploadFile(file, 'editor_images');
          execEditorCmd('insertImage', url);
        } catch (err) {
          console.error(err);
          alert('Erro ao enviar imagem no editor.');
        }
      }
    }

    // Exposição das funções para o escopo global (App)
    window.App = {
      navigateTo,
      toggleTheme,
      handleSearch,
      logoutAdmin,
      editItem,
      deleteItem,
      resetForm,
      execEditorCmd,
      triggerImageUpload,
      handleImageUpload
    };

    // Inicialização do painel
    document.addEventListener('DOMContentLoaded', () => {
      initAdmin();
      initFirebaseListener();
    });
  </script>
</body>
</html>
